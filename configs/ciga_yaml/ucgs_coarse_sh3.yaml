model:
  gaussian:
    init_args:
      sh_degree: 3
  mlp_cfg:
    use: true
    sch: false
    lr: 0.005
    weight_decay: 0
    milestones: []
    gamma: 0.5
  save_iterations:
      - 1000
  renderer:
    class_path: internal.renderers.ciga_renderer2.CigaRenderer

trainer:
  check_val_every_n_epoch: 20
  max_steps: 30000

data:
  path: /home/jinholee/Ciga/data/dataset/SF/traina20g1.8
  parser:
    class_path: EstimatedDepthBlockColmap
    init_args:
      down_sample_factor: 1.0
